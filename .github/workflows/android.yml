name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  BuildRelease:
    if: github.repository_owner == 'Yukile394' && !startsWith(github.ref, 'refs/pull/') && github.ref_name == 'main'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ "all", "arm", "arm64", "x86", "x86_64" ]
      fail-fast: false

    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build type
        id: set-env
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          BUILD_TYPE="DEBUG"

          if [[ "$COMMIT_MSG" == *"pre-release"* ]]; then
            BUILD_TYPE="PRE_RELEASE"
          elif [[ "$COMMIT_MSG" == *"release"* ]]; then
            BUILD_TYPE="RELEASE"
          fi

          echo "ZL_BUILD_TYPE=${BUILD_TYPE}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build Release ${{ matrix.arch }}
        env:
          MOVTERY_KEYSTORE_PASSWORD: ${{ secrets.MOVTERY_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemblerelease -Darch=${{ matrix.arch }}

      - name: Verify APK (size, ABI, manifest, signature)
        run: |
          set -euo pipefail
          APK_DIR=ZalithLauncher/build/outputs/apk/release
          ls -la "$APK_DIR"
          if ls "$APK_DIR"/*unsigned* >/dev/null 2>&1; then echo "::error::Unsigned APK produced"; exit 1; fi
          APKS=("$APK_DIR"/*.apk)
          [ -e "${APKS[0]}" ] || { echo "::error::No APK found"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in "${APKS[@]}"; do
            echo "== $APK"
            SIZE=$(stat -c%s "$APK"); [ "$SIZE" -gt 5000000 ] || { echo "::error::APK too small"; exit 1; }
            unzip -tq "$APK"
            "$BT/aapt" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code"
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            LIBS=$(unzip -l "$APK" | grep -o 'lib/[^/]*/' | sort -u | tr '\n' ' ')
            echo "ABI dirs: $LIBS"
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              [ "$LIBS" = "lib/arm64-v8a/ " ] || { echo "::error::Expected only arm64-v8a, got: $LIBS"; exit 1; }
            fi
          done
          sha256sum "${APKS[@]}"

      - name: Upload Release ${{matrix.arch}}
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher(Release) ${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/release/*

  BuildDebug:
    if: startsWith(github.ref, 'refs/pull/') || github.ref_name != 'main'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ "all", "arm", "arm64", "x86", "x86_64" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build Debug ${{matrix.arch}}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=${{ matrix.arch }}

      - name: Upload Debug ${{matrix.arch}}
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher(Debug) ${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/debug/*
